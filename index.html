<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111922"><title>Фокус 0.3 — чтение и планирование</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#0d121b;--panel:#18212d;--line:#293646;--fg:#f0f4fa;--muted:#9aaabe;--accent:#f46b79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,select,textarea{font:inherit}button{background:#263344;border:1px solid #3c4c60;color:inherit;padding:11px 15px;border-radius:11px;cursor:pointer}button:hover{filter:brightness(1.13)}button.primary{background:#d95065;border-color:#d95065}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:#141c27;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:7px}.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800;padding:6px 11px 27px}.mark{background:#f05d73;color:white;border-radius:10px;padding:7px 11px}.nav{display:block;text-align:left;border:0;background:transparent;color:#acbac9;padding:13px 15px;border-radius:11px;width:100%}.nav.active{background:#302d3c;color:#fff}.bottom{margin-top:auto;padding:15px;font-size:12px;color:#8fa0b5}.main{padding:36px;max-width:1350px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:26px}h1{font-size:30px;margin:0 0 5px}h2{font-size:19px;margin:0 0 15px}h3{margin:0 0 9px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.stat{background:#1d2937;border-radius:14px;padding:19px}.stat strong{font-size:27px;display:block;margin-top:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.gap{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.item:last-child{border:0}.folder{background:#202c3a;padding:20px;border-radius:13px;cursor:pointer}.folder:hover{background:#2b3949}.folder b{display:block;margin:10px 0 4px}input:not([type=range]):not([type=checkbox]):not([type=file]),select,textarea{border:1px solid #455368;background:#101720;color:#fff;border-radius:10px;padding:11px;width:100%}textarea{min-height:105px}input[type=range]{width:100%}label{display:block;color:#bbc7d6;font-size:13px;margin:12px 0 7px}.meter{height:8px;border-radius:12px;background:#344152;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}.reader{height:250px;display:flex;align-items:center;position:relative;justify-content:center;overflow:hidden}.reader:before,.reader:after{content:"";position:absolute;left:50%;width:2px;height:21px;background:var(--accent)}.reader:before{top:31px}.reader:after{bottom:31px}.word{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;font-size:clamp(27px,5vw,55px);font-weight:650;white-space:nowrap}.word span:first-child{text-align:right}.word span:nth-child(2){color:var(--accent)}.word span:last-child{text-align:left}.plain{white-space:pre-wrap;line-height:1.9;max-height:55vh;overflow:auto}.pill{padding:5px 9px;border-radius:20px;background:#29394b;color:#b8c6d6;font-size:12px}.hide{display:none!important}.msg{margin:12px 0;padding:12px 15px;border-radius:10px;background:#24374a;color:#cbd8e9}.mobilemenu{display:none}.link{color:#ff8798;text-decoration:none}.filelabel{cursor:pointer;display:inline-flex;margin:0}.filelabel input{display:none}@media(max-width:800px){.app{display:block}.side{position:sticky;top:0;z-index:3;flex-direction:row;overflow-x:auto;align-items:center;padding:9px;background:#141c27}.brand{padding:5px;white-space:nowrap;font-size:16px}.nav{white-space:nowrap;width:auto;padding:10px}.bottom{display:none}.main{padding:18px}.cols,.grid{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="mark">●</span> Фокус</div><nav id="nav"></nav><div class="bottom">Версия 0.3 · Демонстрационный прототип<br>Все данные сохраняются в этом браузере</div></aside><main class="main"><header class="top"><div><h1 id="title">Главная</h1><div id="subtitle" class="muted">Ваше пространство для чтения</div></div><span class="pill">● Демо-режим</span></header><div id="content"></div></main></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='fokus_public_03',routes=[['home','◈ Главная'],['library','▣ Библиотека'],['reader','▤ Читалка'],['planner','◷ Планировщик'],['tasks','☑ Задачи и заметки'],['stats','▥ Статистика'],['profile','♙ Профиль'],['billing','◫ Подписка']];
const sample='Добро пожаловать в Фокус. Это персональная платформа для чтения и планирования. Здесь можно хранить документы, создавать папки, ставить цели и читать текст по одному слову. Выберите комфортную скорость чтения. Помните, что скорость показа не означает понимания прочитанного.';
const fresh=()=>({name:'Читатель',folders:[{id:'books',name:'Книги',parent:null},{id:'docs',name:'Документы',parent:null}],docs:[{id:'demo',name:'Знакомство с Фокусом',folder:'books',text:sample,size:sample.length,position:0}],tasks:[],notes:[],goals:[],sessions:[],speed:300,accent:'#f46b79',folder:null,doc:'demo'});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}let page='home',playing=false,timer=null,started=null,mode='rsvp';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Локальное хранилище браузера заполнено. Удалите часть документов.')}};const id=()=>Math.random().toString(36).slice(2,11);const words=d=>(d?.text||'').trim().split(/\s+/u).filter(Boolean);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=()=>new Date().toISOString().slice(0,10);const current=()=>db.docs.find(x=>x.id===db.doc)||db.docs[0];const counts=()=>db.docs.reduce((s,d)=>s+d.size,0);const wsum=()=>db.docs.reduce((s,d)=>s+Math.min(d.position,words(d).length),0);
const btn=(text,fn,cls='')=>'<button class="'+cls+'" data-action="'+fn+'">'+text+'</button>';const note=t=>'<p class="muted">'+t+'</p>';
const panel=(h,x)=>'<section class="panel"><h2>'+h+'</h2>'+x+'</section>';const progress=d=>{const n=words(d).length;return n?Math.min(100,Math.round(100*d.position/n)):0};const bar=p=>'<div class="meter"><div class="fill" style="width:'+p+'%"></div></div>';
const rowDoc=d=>'<div class="item"><div><strong>📄 '+esc(d.name)+'</strong><div class="muted" style="font-size:12px">'+words(d).length+' слов · '+progress(d)+'% прочитано</div></div>'+btn('Читать','read:'+d.id,'primary')+'</div>';
function home(){const d=current(),n=db.tasks.filter(t=>!t.done).length;return '<div class="grid"><div class="stat"><small>Документов</small><strong>'+db.docs.length+'</strong></div><div class="stat"><small>Прочитано слов</small><strong>'+wsum().toLocaleString('ru-RU')+'</strong></div><div class="stat"><small>Активные задачи</small><strong>'+n+'</strong></div></div><br>'+panel('Продолжить чтение',d?'<div class="row"><div><h3>'+esc(d.name)+'</h3><small>'+progress(d)+'% прочитано</small></div>'+btn('Продолжить →','read:'+d.id,'primary')+'</div>'+bar(progress(d)):note('Загрузите первый документ в библиотеку.'))+'<div class="cols">'+panel('Мои задачи',db.tasks.filter(t=>!t.done).slice(0,4).map(t=>'<div class="item">'+esc(t.name)+' <small>'+esc(t.when||'Без срока')+'</small></div>').join('')||note('Пока нет задач.'))+panel('Быстрый старт',btn('Загрузить документ','nav:library','primary')+' '+btn('Поставить цель','nav:planner'))+'</div>'}
function library(){const f=db.folder,children=db.folders.filter(x=>x.parent===f),docs=db.docs.filter(x=>x.folder===f);return '<div class="gap" style="margin-bottom:15px">'+btn('＋ Папка','newfolder')+'<label class="filelabel"><input id="file" type="file" accept=".txt,.fb2,text/plain"><span class="primary" style="display:inline-block;background:#d95065;padding:11px 15px;border-radius:11px;color:white">↑ Загрузить TXT / FB2</span></label>'+ (f?btn('← Назад','folder:back'):'')+'</div>'+panel('Папки · '+(f?esc(db.folders.find(x=>x.id===f)?.name||''):'Моя библиотека'),'<div class="grid">'+children.map(x=>'<div class="folder" data-action="folder:'+x.id+'">📁 <b>'+esc(x.name)+'</b><small>'+db.docs.filter(d=>d.folder===x.id).length+' файлов</small></div>').join('')+'</div>'+(!children.length?note('В этой папке пока нет вложенных папок.'):'') )+panel('Документы',docs.map(rowDoc).join('')||note('В этой папке нет документов. Загрузи TXT или FB2.'))+note('Данные демонстрационной версии хранятся только в браузере. Это пока не облачное хранилище.')}
function wordParts(w){const a=Array.from(w||'●');let j=a.findIndex(c=>/[\p{L}\p{N}]/u.test(c));if(j<0)j=0;const k=Math.min(a.length-1,j+Math.max(0,Math.ceil((a.length-j)*.35)-1));return '<span>'+esc(a.slice(0,k).join(''))+'</span><span>'+esc(a[k]||'●')+'</span><span>'+esc(a.slice(k+1).join(''))+'</span>'}
function reader(){const d=current();if(!d)return panel('Читалка',note('Сначала загрузите документ.'));const ww=words(d),i=Math.min(d.position,ww.length),p=progress(d);return panel(esc(d.name),'<div class="row"><div class="gap">'+btn('RSVP','mode:rsvp',mode==='rsvp'?'primary':'')+btn('Обычный текст','mode:plain',mode==='plain'?'primary':'')+'</div><small id="rc">'+i+' / '+ww.length+' слов</small></div>'+(mode==='rsvp'?'<div class="reader"><div id="word" class="word">'+wordParts(ww[i]||'✓')+'</div></div><div class="gap" style="justify-content:center">'+btn('↶ 10','back')+'<button class="primary" id="play">▶ Начать</button>'+btn('10 ↷','forward')+btn('Сначала','reset')+'</div>': '<div class="plain">'+esc(d.text)+'</div>')+'<div style="margin-top:18px">'+bar(p)+'<div class="row"><small id="percent">'+p+'% прочитано</small><small id="lefttime">Осталось ~'+Math.ceil((ww.length-i)/db.speed)+' мин</small></div></div>')+panel('Настройки','<div class="row"><label>Скорость чтения: <b id="speednum">'+db.speed+'</b> слов/мин</label><label>Опорная буква <input type="color" id="accent" value="'+db.accent+'" style="width:42px;vertical-align:middle"></label></div><input id="speed" type="range" min="100" max="1000" step="25" value="'+db.speed+'">')}
function planner(){const options=db.docs.map(d=>'<option value="'+d.id+'">'+esc(d.name)+'</option>').join('');return panel('Калькулятор времени и план чтения','<label>Документ</label><select id="goalDoc">'+options+'</select><div class="grid"><div><label>Минут в день</label><input id="goalMin" type="number" min="5" max="240" value="20"></div><div><label>Дней в неделю</label><input id="goalDays" type="number" min="1" max="7" value="5"></div><div><label>Скорость, слов/мин</label><input id="goalSpeed" type="number" min="100" max="1000" value="'+db.speed+'"></div></div><div class="msg" id="estimate">Выберите параметры и нажмите «Рассчитать»</div>'+btn('Рассчитать','estimate','primary')+' '+btn('Сохранить цель','savegoal'))+panel('Мои цели',db.goals.map(g=>'<div class="item"><div><strong>'+esc(db.docs.find(d=>d.id===g.doc)?.name||'Документ')+'</strong><div><small>'+g.minutes+' мин / день · '+g.days+' дн. в неделю</small></div></div><span class="pill">Активна</span></div>').join('')||note('Целей ещё нет.'))}
function tasks(){return '<div class="cols">'+panel('Задачи','<div class="gap"><input id="newTask" placeholder="Новая задача" style="flex:1">'+btn('Добавить','addtask','primary')+'</div><label>Дата выполнения</label><input type="date" id="taskDate" value="'+date()+'">'+db.tasks.map(t=>'<div class="item"><div>'+(t.done?'✅ ':'⬜ ')+esc(t.name)+'<br><small>'+esc(t.when)+'</small></div>'+btn(t.done?'Вернуть':'Готово','done:'+t.id)+'</div>').join(''))+panel('Заметки','<textarea id="newNote" placeholder="Запишите мысль, идею или цитату..."></textarea><div style="margin:10px 0">'+btn('Сохранить заметку','addnote','primary')+'</div>'+db.notes.map(n=>'<div class="item"><span>'+esc(n.text)+'</span>'+btn('×','delnote:'+n.id)+'</div>').join(''))+'</div>'}
function stats(){return '<div class="grid"><div class="stat"><small>В библиотеке</small><strong>'+db.docs.length+'</strong></div><div class="stat"><small>Пройдено слов</small><strong>'+wsum()+'</strong></div><div class="stat"><small>Завершено задач</small><strong>'+db.tasks.filter(x=>x.done).length+'</strong></div></div><br>'+panel('Прогресс чтения',db.docs.map(d=>'<div style="margin-bottom:18px"><div class="row"><b>'+esc(d.name)+'</b><small>'+progress(d)+'%</small></div>'+bar(progress(d))+'</div>').join('')||note('Нет документов.'))}
function profile(){return panel('Мой профиль','<label>Отображаемое имя</label><input id="username" value="'+esc(db.name)+'"><label>Скорость чтения</label><input id="profSpeed" type="number" min="100" max="1000" value="'+db.speed+'"><div style="margin-top:16px">'+btn('Сохранить','saveprofile','primary')+' '+btn('Экспорт данных JSON','export')+'</div>')+panel('О данных',note('Прототип без регистрации: профиль существует только в данном браузере. Синхронизацию между устройствами и облачное хранение добавим в следующих версиях.'))}
function billing(){return '<div class="grid"><div class="panel"><h2>Free</h2><h1>0 ₽</h1><p>50 МБ — планируемый лимит облачного тарифа</p><span class="pill">Текущий прототип</span></div><div class="panel"><h2>Plus</h2><h1>149 ₽ / мес.</h1><p>1 ГБ хранилища и расширенные возможности</p><span class="pill">В разработке</span></div><div class="panel"><h2>Pro</h2><h1>299 ₽ / мес.</h1><p>10 ГБ и персональные тренировки</p><span class="pill">В разработке</span></div></div>'+panel('Данные браузера','Сохранено локально примерно '+(counts()/1024).toFixed(1)+' КБ. Лимит 50 МБ здесь не обеспечивается сервером — это будущая функция.')}
const views={home,library,reader,planner,tasks,stats,profile,billing};
function route(p){pause();page=views[p]?p:'home';location.hash=page;render()}
function render(){document.documentElement.style.setProperty('--accent',db.accent);$('nav').innerHTML=routes.map(([p,n])=>'<button class="nav '+(page===p?'active':'')+'" data-action="nav:'+p+'">'+n+'</button>').join('');$('title').textContent=routes.find(x=>x[0]===page)?.[1].slice(2)||'Главная';$('subtitle').textContent=page==='library'?'Папки, книги и документы':page==='reader'?'Чтение в удобном темпе':'Личное пространство для чтения';$('content').innerHTML=views[page]();if(page==='reader'){let a=$('play');if(a)a.onclick=()=>playing?pause():play();$('speed').oninput=e=>{db.speed=+e.target.value;$('speednum').textContent=db.speed;save()};$('accent').oninput=e=>{db.accent=e.target.value;document.documentElement.style.setProperty('--accent',db.accent);save()}}if(page==='library'){const file=$('file');file.onchange=async()=>{const f=file.files?.[0];if(!f)return;if(f.size>2e6)return alert('Для демо загрузите файл до 2 МБ.');let text=await f.text();if(/\.fb2$/i.test(f.name)){try{const xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw 0;text=xml.querySelector('body')?.textContent||text}catch{return alert('Не удалось обработать FB2')}}const d={id:id(),name:f.name,folder:db.folder,text,size:f.size,position:0};db.docs.push(d);db.doc=d.id;save();render()}}}
function tick(){const d=current();if(!playing||!d)return;const w=words(d);if(d.position>=w.length){pause();render();return}updateReader();let delay=60000/db.speed;if(/[.!?…]$/.test(w[d.position]))delay*=1.7;timer=setTimeout(()=>{d.position++;save();tick()},delay)}
function updateReader(){const d=current();if(!d||page!=='reader')return;let w=words(d);if($('word'))$('word').innerHTML=wordParts(w[d.position]||'✓');if($('rc'))$('rc').textContent=Math.min(d.position,w.length)+' / '+w.length+' слов';if($('percent'))$('percent').textContent=progress(d)+'% прочитано';const fill=document.querySelector('.reader + .gap ~ div .fill')||document.querySelector('.panel .fill');if(fill)fill.style.width=progress(d)+'%';if($('lefttime'))$('lefttime').textContent='Осталось ~'+Math.ceil(Math.max(0,w.length-d.position)/db.speed)+' мин'}
function play(){const d=current();if(!d)return;if(d.position>=words(d).length)d.position=0;playing=true;const b=$('play');if(b)b.textContent='Ⅱ Пауза';tick()}
function pause(){playing=false;clearTimeout(timer);const b=$('play');if(b)b.textContent='▶ Продолжить';save()}
function act(a){if(a.startsWith('nav:'))return route(a.slice(4));if(a.startsWith('folder:')){const x=a.slice(7);db.folder=x==='back'?(db.folders.find(f=>f.id===db.folder)?.parent||null):x;save();return render()}if(a.startsWith('read:')){db.doc=a.slice(5);save();return route('reader')}if(a==='newfolder'){const name=prompt('Название новой папки');if(!name?.trim())return;db.folders.push({id:id(),name:name.trim(),parent:db.folder});save();return render()}if(a==='mode:rsvp'||a==='mode:plain'){mode=a.split(':')[1];pause();return render()}if(a==='back'||a==='forward'||a==='reset'){pause();const d=current();if(d){d.position=a==='reset'?0:Math.max(0,Math.min(words(d).length,d.position+(a==='back'?-10:10)));save();render()}return}if(a==='estimate'||a==='savegoal'){const d=db.docs.find(x=>x.id===$('goalDoc').value);if(!d)return;const minutes=Math.max(1,+$('goalMin').value||20),days=Math.min(7,Math.max(1,+$('goalDays').value||5)),speed=Math.max(50,+$('goalSpeed').value||300),remaining=Math.max(0,words(d).length-d.position),total=remaining/speed,sessions=Math.ceil(total/minutes);$('estimate').textContent='Осталось '+remaining.toLocaleString('ru-RU')+' слов ≈ '+Math.ceil(total)+' минут · '+sessions+' занятий по '+minutes+' мин. Это примерно '+Math.ceil(sessions/days)+' недель при '+days+' днях чтения в неделю.';if(a==='savegoal'){db.goals.push({id:id(),doc:d.id,minutes,days,speed});save();render()}return}if(a==='addtask'){const name=$('newTask').value.trim();if(!name)return;db.tasks.push({id:id(),name,when:$('taskDate').value,done:false});save();return render()}if(a.startsWith('done:')){const t=db.tasks.find(t=>t.id===a.slice(5));if(t)t.done=!t.done;save();return render()}if(a==='addnote'){const text=$('newNote').value.trim();if(text)db.notes.push({id:id(),text});save();return render()}if(a.startsWith('delnote:')){db.notes=db.notes.filter(n=>n.id!==a.slice(8));save();return render()}if(a==='saveprofile'){db.name=$('username').value;db.speed=Math.min(1000,Math.max(100,+$('profSpeed').value||300));save();return render()}if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fokus-backup.json';a.click();URL.revokeObjectURL(url)}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a)act(a.dataset.action)});document.addEventListener('keydown',e=>{if(e.code==='Space'&&page==='reader'&&!['INPUT','TEXTAREA','BUTTON','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();playing?pause():play()}});window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(p!==page)route(p)});page=views[location.hash.slice(1)]?location.hash.slice(1):'home';render();
})();
</script></body></html>
